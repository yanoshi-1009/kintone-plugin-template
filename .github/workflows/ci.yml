name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm exec cli-kintone plugin keygen --output private.ppk
      - run: pnpm build:prod
